name: Deploy frontend to GitHub Pages

# GitHub Pages only serves static files, so this builds and publishes just the
# Astro frontend. The backend (Express + SQLite) can't run here — it's hosted
# separately (see render.yaml) and PUBLIC_API_URL below points the built site
# at it. See README.md "Deploying" for the one-time setup this depends on:
# Pages source set to "GitHub Actions", and the PUBLIC_API_URL repo variable.
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          # A project Pages site is served from "/<repo-name>/", not the domain
          # root, so every hand-written internal link needs that prefix baked in
          # at build time (see src/lib/ui.js's withBase()).
          BASE_PATH: /${{ github.event.repository.name }}
          # Set once in Settings -> Secrets and variables -> Actions -> Variables,
          # after the backend is deployed (e.g. https://utg-connect-api.onrender.com/api).
          # Left unset, the build falls back to http://localhost:4000/api, which
          # only works for people running the backend on their own machine.
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
